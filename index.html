<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>복약 다이어리</title>
  <meta name="description" content="약 복용 루틴, 매일의 복용 체크와 메모를 기록하는 앱">
  <meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1311" media="(prefers-color-scheme: dark)">
  <!-- 아이폰 홈 화면에 추가하면 주소창 없이 앱처럼 열린다 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="복약 다이어리">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">복약 다이어리</h1>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="화면 이동">
    <button type="button" class="tab" data-view="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9"/></svg>
      <span>오늘</span>
    </button>
    <button type="button" class="tab" data-view="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>달력</span>
    </button>
    <button type="button" class="tab" data-view="memos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></svg>
      <span>메모</span>
    </button>
    <button type="button" class="tab" data-view="meds">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="8.5" width="19" height="7" rx="3.5" transform="rotate(-45 12 12)"/><path d="m9.5 9.5 5 5"/></svg>
      <span>약 설정</span>
    </button>
    <button type="button" class="tab" data-view="export">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M5 12.5V18a2.5 2.5 0 0 0 2.5 2.5h9A2.5 2.5 0 0 0 19 18v-5.5"/></svg>
      <span>보내기</span>
    </button>
  </nav>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>이 앱은 JavaScript 가 켜져 있어야 동작해요.</noscript>
  <script src="schedule.js"></script>
  <script src="app.js"></script>
</body>
</html>
